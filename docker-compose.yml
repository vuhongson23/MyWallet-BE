services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mywallet-api
    restart: unless-stopped
    expose:
      - '8081'
    environment:
      NODE_ENV: production
      PORT: 8081
      DB_HOST: mysql
      PORT_DB: 3307
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-mywallet}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: mywallet-mysql
    restart: unless-stopped
    expose:
      - '3307'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-mywallet}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
